<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Web Watch NYC — Hot Spots</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Inter:wght@400;600&family=Special+Elite&display=swap" rel="stylesheet">  <!-- Твой CSS: ВСЕГДА после Bootstrap -->
  <link href="css/style.css" rel="stylesheet">
</head>
<body>

  <header>
    <nav class="navbar navbar-expand-md">
      <div class="container">
        <a class="navbar-brand" href="index.html">WEB WATCH NYC</a>

        <button class="navbar-toggler" type="button"
                data-bs-toggle="collapse" data-bs-target="#mainMenu"
                aria-controls="mainMenu" aria-expanded="false" aria-label="Открыть меню">
          <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="mainMenu">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item">
              <a class="nav-link active" href="index.html">Hot Spots</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="report.html">Report Observation</a>
            </li>
          </ul>
        </div>
      </div>
    </nav>
  </header>

  <main>
    <section class="container my-5">
        <h1>Report Observation</h1>

        <form class="comic-panel report-form">
        <fieldset>
            <legend>Who are you</legend>
            <div class="mb-3">
            <label for="nick" class="form-label">Nickname</label>
            <input type="text" id="nick" class="form-control" required minlength="3">
            </div>
            <div class="mb-3">
            <label for="email" class="form-label">Email</label>
            <input type="email" id="email" class="form-control" required>
            </div>
        </fieldset>

        <fieldset>
            <legend>What you saw</legend>
            <div class="mb-3">
            <label for="when" class="form-label">Date and Time</label>
            <input type="datetime-local" id="when" class="form-control" required>
            </div>
            <div class="mb-3">
            <label for="area" class="form-label">Neighborhood</label>
            <select id="area" class="form-select" required>
                <option value="">Choose neighborhood</option>
                <option>Manhattan</option>
                <option>Brooklyn</option>
                <option>Queens</option>
                <option>The Bronx</option>
                <option>Staten Island</option>
            </select>
            </div>
            <div class="mb-3">
            <label for="place" class="form-label">Exact Location</label>
            <input type="text" id="place" class="form-control" required>
            </div>

            <p class="mb-1">What was he doing?</p>
            <div class="form-check">
            <input type="radio" name="action" id="a1" class="form-check-input" checked>
            <label for="a1" class="form-check-label">Flying</label>
            </div>
            <div class="form-check">
            <input type="radio" name="action" id="a2" class="form-check-input">
            <label for="a2" class="form-check-label">Fighting</label>
            </div>
            <div class="form-check mb-3">
            <input type="radio" name="action" id="a3" class="form-check-input">
            <label for="a3" class="form-check-label">Helping</label>
            </div>

            <div class="mb-3">
            <label for="sure" class="form-label">How certain are you?</label>
            <input type="range" id="sure" class="form-range" min="1" max="10">
            </div>
            <div class="mb-3">
            <label for="text" class="form-label">Description</label>
            <textarea id="text" class="form-control" rows="3"></textarea>
            </div>
        </fieldset>

        <div class="form-check mb-3">
            <input type="checkbox" id="promise" class="form-check-input" required>
            <label for="promise" class="form-check-label">I promise not to try to find out who's under the mask</label>
        </div>

        <button type="submit" class="btn btn-web">Submit</button>
        </form>
    </section>
  </main>
</body>

  <footer class="bg-dark text-light py-3">
    <div class="container text-center">
      &copy; 2024 Web Watch NYC
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
